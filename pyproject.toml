[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "turtlebench"
version = "0.1.0"
description = "Situation-puzzle benchmark runner for Hermes Agent"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "fffonion"}]
dependencies = []

[project.scripts]
turtlebench = "turtlebench.benchmark_runner:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
